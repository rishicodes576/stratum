name: Verify Stratum
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: stratum, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: stratum }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stratum"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://stratum:ci-only-password@localhost:5432/stratum
      DATABASE_URL: postgresql+asyncpg://stratum:ci-only-password@localhost:5432/stratum
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-not-a-deployment-secret-01234567890123456789
      COVERAGE_CORE: ctrace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: python -m app.export_schema
      - name: Verify API contract is current
        run: python ../scripts/check-contract.py
      - run: python -m pytest --cov=app --cov-branch --cov-fail-under=85 --cov-report=xml --junitxml=pytest-results.xml
      - run: pip-audit -r requirements.lock --disable-pip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-verification
          path: |
            backend/coverage.xml
            backend/pytest-results.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run generate:api && git diff --exit-code -- src/lib/schema.d.ts
      - run: npm audit --audit-level=high
      - run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: python scripts/setup.py
      - run: docker compose up --build -d --wait --wait-timeout 180 api worker web
      - run: docker compose --profile demo run --rm seed
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
      - name: Collect container logs
        if: always()
        run: docker compose --profile demo logs --no-color > compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-and-container-verification
          path: |
            frontend/playwright-report
            frontend/test-results
            compose.log
      - if: always()
        run: docker compose --profile demo down -v
