[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratum-api"
version = "1.0.0"
description = "An auditable, tenant-isolated reliability control plane"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0.40,<2.1",
  "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "PyJWT>=2.10,<3", "redis>=6,<9",
  "httpx>=0.28,<1", "prometheus-client>=0.22,<1", "structlog>=25,<27"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "fakeredis>=2.28,<3", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires a dedicated PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.coverage.run]
concurrency = ["greenlet"]
omit = ["app/seed.py", "app/bootstrap.py", "app/export_schema.py"]

[tool.coverage.report]
show_missing = true
